[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-tiptap-suite"
version = "1.0.5"
description = "A modern, headless Tiptap v2 rich text editor widget for Django."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "django>=4.2",
    "pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/IacoM/django-tiptap-suite"
Issues = "https://github.com/IacoM/django-tiptap-suite/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "black",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_tiptap_suite"]
