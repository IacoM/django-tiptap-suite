<div class="tiptap-suite-wrapper" id="wrapper-{{ widget.attrs.id }}">
  <textarea 
    name="{{ widget.name }}" 
    id="{{ widget.attrs.id }}" 
    style="display: none;" 
    {% include "django/forms/widgets/attrs.html" %}>{{ widget.value }}</textarea>
  
  <div id="tiptap-container-{{ widget.attrs.id }}" class="django-tiptap-suite-editor tiptap-suite-container"></div>
</div>

<script>
  (function() {
    function getCSRFToken() {
      let token = '{{ csrf_token|escapejs }}';
      if (token && token.trim() !== '') { return token; }

      const input = document.querySelector('input[id="csrftoken"]');
      if (input && input.value) {return input.value;}

      const cookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));

      if (cookie) {return decodeURIComponent(cookie.split('=').slice(1).join('=')); }

      console.error("CSRF not found in form or cookie")
      return 'CSRF NOT FOUND';
    }
    function init() {
      if (window.initTiptapSuite) {
        window.initTiptapSuite(
          '{{ widget.attrs.id }}', 
          '{% url "django_tiptap_suite:upload_image" %}',
          getCSRFToken(),
          {{ widget.config|default:"{}"|safe }}
        );
      }
    }
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init);
    }
  })();
</script>
